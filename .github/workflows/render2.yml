name: Render v2

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 libgbm1

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -q ./*.zip -d project
          find project -maxdepth 3 -not -path '*/node_modules/*' | head -40

      - name: Render
        run: |
          PKG=$(find project -name package.json -not -path '*/node_modules/*' | head -1)
          echo "package.json: $PKG"
          cd "$(dirname "$PKG")"
          npm install
          mkdir -p out
          CONC=$(nproc)
          echo "Using $CONC cores"
          npx remotion render src/index.jsx Story out/full_silent.mp4 --gl=swangle --concurrency=$CONC --image-format=jpeg --jpeg-quality=92 --crf=17 --timeout=180000
          npx remotion ffmpeg -y -hide_banner -loglevel error -i out/full_silent.mp4 -i voiceover.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest final.mp4
          cp final.mp4 "$GITHUB_WORKSPACE/final.mp4"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4
